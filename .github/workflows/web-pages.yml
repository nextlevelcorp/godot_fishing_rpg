name: Web build and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4-stable"
  GODOT_BASE: "https://github.com/godotengine/godot/releases/download/4.4-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot and its export templates are cached between runs: GitHub's release downloads failed
      # with 504s and a cut-short zip on 2026-11-08 and blocked deploys. Only a cold cache downloads.
      - name: Cache Godot ${{ env.GODOT_VERSION }} and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/Godot_v4.4-stable_linux.x86_64
            ~/.local/share/godot/export_templates/4.4.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          # --retry: a download cut short once (build 71) and broke the build with a corrupt zip
          curl -sSL --fail --retry 8 --retry-delay 20 --retry-all-errors -o godot.zip "$GODOT_BASE/Godot_v4.4-stable_linux.x86_64.zip"
          curl -sSL --fail --retry 8 --retry-delay 20 --retry-all-errors -o templates.tpz "$GODOT_BASE/Godot_v4.4-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          unzip -q templates.tpz -d tpl
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv tpl/templates/* "$TEMPLATE_DIR/"
          rm -rf tpl templates.tpz godot.zip

      - name: Import project resources
        run: $HOME/godot/Godot_v4.4-stable_linux.x86_64 --headless --path . --import || true

      - name: Parse-check every game script
        # Export only tokenizes scripts, so a type error would still ship and fail on the player's
        # device. Loading each script with Godot itself catches it here and fails the build.
        run: |
          SCRIPTS=$(ls *.gd | sed 's|^|res://|')
          $HOME/godot/Godot_v4.4-stable_linux.x86_64 --headless --path . -s res://.claude/scripts/godot-parse-check.gd -- $SCRIPTS

      - name: Smoke-run the map and the shore scene
        # Runs each scene headless for 600 frames and fails on any script or engine error, so runtime
        # problems (bad node paths, null access, type errors) stop the deploy instead of the player.
        run: |
          G=$HOME/godot/Godot_v4.4-stable_linux.x86_64
          status=0
          for scene in res://title_screen.tscn res://turkey_map.tscn res://shore_fishing.tscn; do
            echo "== smoke: $scene"
            timeout 120 $G --headless --path . "$scene" --quit-after 600 > smoke.log 2>&1 || echo "(exit code $?)"
            cat smoke.log
            if grep -E "SCRIPT ERROR|Parse Error|^ERROR:" smoke.log | grep -v -E "resources still in use at exit|ObjectDB instances leaked"; then
              echo "::error::Smoke run of $scene printed errors"
              status=1
            fi
          done
          exit $status

      - name: Feature smoke test (audio, settings, TEST fish)
        # Blocking since 2026-11-07 (green from build 46 on): a failed check stops the deploy.
        # Drives the real shore scene: sounds load and play, settings survive a save, a TEST fish is
        # hooked, jumps and is landed with no rewards. It proves the code paths run; it cannot hear.
        run: |
          G=$HOME/godot/Godot_v4.4-stable_linux.x86_64
          timeout 180 $G --headless --path . -s res://tests/smoke_features.gd --quit-after 2000 > feat.log 2>&1 || echo "(exit code $?)"
          cat feat.log
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR:|SMOKE FAIL" feat.log | grep -v -E "resources still in use at exit|ObjectDB instances leaked"; then
            echo "::error::Feature smoke test failed"
            exit 1
          fi
          grep -q "SMOKE done" feat.log || { echo "::error::Feature smoke test did not finish"; exit 1; }

      - name: Export Web build (unique file names, no stale cache)
        # Godot's web files (index.pck, index.wasm) get cached hard by phones, so a new deploy could
        # keep showing the old game. Each build is exported under its own name (g<run number>) and
        # index.html is a tiny loader that reads version.json (never cached) and opens that page.
        run: |
          set -e
          mkdir -p build/web
          PAGE="g${GITHUB_RUN_NUMBER}"
          $HOME/godot/Godot_v4.4-stable_linux.x86_64 --headless --path . --export-release "Web" "build/web/${PAGE}.html"
          printf '{"page":"%s.html","build":"%s"}\n' "$PAGE" "$GITHUB_RUN_NUMBER" > build/web/version.json
          cat > build/web/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Shore Fishing</title>
          <body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#06182a;color:#9cd;font:18px sans-serif">
          Loading...
          <script>
          fetch('version.json?t=' + Date.now(), {cache: 'no-store'})
            .then(function (r) { return r.json(); })
            .then(function (v) { location.replace(v.page + '?b=' + v.build); })
            .catch(function () { document.body.textContent = 'Could not load the game. Check your connection and reload.'; });
          </script>
          HTML
          # A phone that kept an old g<N>.html address (bookmark, home-screen icon, history) would get a
          # 404 once a newer build replaced it. GitHub Pages serves 404.html for any missing path, so
          # this sends the player to the project root, whose loader opens the current build.
          cat > build/web/404.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Shore Fishing</title>
          <body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#06182a;color:#9cd;font:18px sans-serif">
          Opening the latest version...
          <script>
          var root = '/' + location.pathname.split('/')[1] + '/';
          location.replace(root + '?r=' + Date.now());
          </script>
          HTML
          ls -la build/web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
